<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="Logo FOLP UNLP">
  <defs>
    <linearGradient id="folpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006155"/>
      <stop offset="100%" stop-color="#004038"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46A3B7"/>
      <stop offset="100%" stop-color="#2D7B8E"/>
    </linearGradient>
  </defs>
  
  <!-- Emblem Badge -->
  <g transform="translate(10, 10)">
    <!-- Base Shield/Hex -->
    <rect x="0" y="0" width="60" height="60" rx="14" fill="url(#folpGrad)" />
    
    <!-- Caduceus / Tooth / Joint Stylized Outline -->
    <path d="M 30 12 C 22 12 18 17 18 24 C 18 31 22 36 25 43 C 27 47 28 51 30 51 C 32 51 33 47 35 43 C 38 36 42 31 42 24 C 42 17 38 12 30 12 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- TMJ Condyle & Disc stylized arcs -->
    <path d="M 23 20 Q 30 16 37 20" fill="none" stroke="#46A3B7" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="30" cy="27" r="3.5" fill="#46A3B7" />
    <path d="M 24 35 Q 30 38 36 35" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Medical Cross accent -->
    <path d="M 46 10 L 50 10 M 48 8 L 48 12" stroke="#46A3B7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="82" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#006155" letter-spacing="0.5">FOLP · UNLP</text>
  <text x="82" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#46A3B7" letter-spacing="0.2">HOSPITAL ODONTOLÓGICO</text>
  <text x="82" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#64748B">Guardia de Dolor Orofacial y ATM</text>
</svg>
