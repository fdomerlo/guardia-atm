<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006155"/>
      <stop offset="100%" stop-color="#003b33"/>
    </linearGradient>
    <linearGradient id="jointGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46A3B7"/>
      <stop offset="100%" stop-color="#72c5d6"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#46A3B7" stroke-width="4" stroke-opacity="0.3" />

  <g filter="url(#dropShadow)" transform="translate(4, 0)">
    <!-- Stylized Mandible & Temporomandibular Articulation -->
    <!-- Cranial Fossa Arch -->
    <path d="M 140 180 C 180 140 240 140 280 170 C 310 192 340 190 370 170" 
          fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>

    <!-- Articular Disc -->
    <ellipse cx="280" cy="205" rx="36" ry="14" fill="url(#jointGrad)" transform="rotate(-15, 280, 205)" />

    <!-- Condyle Head & Mandibular Ramus -->
    <path d="M 270 230 C 290 230 305 245 305 268 C 305 320 280 370 240 395 C 205 415 160 410 140 370 C 130 350 145 330 165 330 C 190 330 220 310 245 270 C 255 255 255 240 245 230 Z" 
          fill="#FFFFFF" />

    <!-- Joint Movement / Energy Waves -->
    <path d="M 330 230 Q 360 250 340 280" fill="none" stroke="#46A3B7" stroke-width="12" stroke-linecap="round" />
    <path d="M 360 215 Q 400 245 375 295" fill="none" stroke="#46A3B7" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8" />

    <!-- Emergency Cross in Corner -->
    <g transform="translate(350, 110)">
      <rect x="14" y="0" width="12" height="40" rx="4" fill="#E2E8F0"/>
      <rect x="0" y="14" width="40" height="12" rx="4" fill="#E2E8F0"/>
      <rect x="16" y="2" width="8" height="36" rx="3" fill="#DC2626"/>
      <rect x="2" y="16" width="36" height="8" rx="3" fill="#DC2626"/>
    </g>
  </g>

  <!-- Hospital Subtitle Badge -->
  <rect x="96" y="426" width="320" height="44" rx="22" fill="#004038" />
  <text x="256" y="454" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#46A3B7" letter-spacing="2">FOLP · GUARDIA ATM</text>
</svg>
