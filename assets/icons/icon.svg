<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Paleta Institucional FOLP / UNLP - Verde Quirúrgico Profundo -->
    <linearGradient id="bgPwa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004434"/>
      <stop offset="60%" stop-color="#00281e"/>
      <stop offset="100%" stop-color="#00150f"/>
    </linearGradient>

    <!-- Sombra sutil de elevación -->
    <filter id="dropShadowPwa" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fondo de sangrado completo (100% compatible con W3C Maskable Icon) -->
  <rect width="512" height="512" fill="url(#bgPwa)"/>

  <!-- Composición anatómica ajustada al 100% de la Safe-Zone circular (r=204.8) -->
  <g transform="translate(47, 54) scale(2.06)" filter="url(#dropShadowPwa)">
    <!-- Perfil Cefálico (Contorno de Cabeza y Cuello) -->
    <path d="M 41 174 
             C 42 165 47 155 49 143 
             C 46 128 39 105 32 88 
             C 29 78 29 68 33 50 
             C 38 34 52 24 72 20 
             C 80 18 90 18 96 18 
             C 118 19 138 29 149 46 
             C 155 58 155 70 154 80 
             C 155 86 160 92 167 100 
             C 171 105 171 108 168 111 
             C 162 113 159 116 158 120 
             C 158 124 157 127 157 130 
             C 157 134 156 140 155 145 
             C 152 151 146 153 136 153 
             C 124 153 118 158 116 174" 
          fill="none" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mandíbula Anatómica conectando mentón y ATM -->
    <path d="M 95.4 127.2 
             L 95.4 138 
             C 95.4 146 102 151 114 152 
             L 142 153" 
          fill="none" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Ondas de Resonancia / Dolor Orofacial Izquierdas -->
    <path d="M 77 94 A 23.5 23.5 0 0 0 77 127" fill="none" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round"/>
    <path d="M 67 87 A 35.5 35.5 0 0 0 67 134" fill="none" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round"/>

    <!-- Ondas de Resonancia / Dolor Orofacial Derechas -->
    <path d="M 114 94 A 23.5 23.5 0 0 1 114 127" fill="none" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round"/>
    <path d="M 124 87 A 35.5 35.5 0 0 1 124 134" fill="none" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round"/>

    <!-- Disco Articular ATM (Cian Institucional FOLP #46A3B7) -->
    <circle cx="95.4" cy="110.7" r="16.5" fill="#46A3B7" stroke="none"/>
    <circle cx="95.4" cy="110.7" r="7.8" fill="#00281e" stroke="#FFFFFF" stroke-width="3.8"/>
  </g>
</svg>
